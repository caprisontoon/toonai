<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TOONAI · 시그니처 후원 (WHO + SIGNATURE)</title>
<style>
  :root{
    --brand-700:#6D28D9; --brand-500:#8B5CF6; --brand-300:#C4B5FD;
    --accent:#F472B6; --bg:#0F0B1E; --surface:#1B1430; --surface-2:#272042;
    --text:#F5F3FF; --text-dim:#A99FD0; --line:#332a52;
    --special:#8B5CF6; --legend:#FBBF24; --hot:#F472B6; --ai:#34D399;
    --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--text);
    background:
      radial-gradient(1200px 700px at 15% -10%, #3b2270 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 110%, #4c1d6e 0%, transparent 50%),
      #0a0716;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  button{font-family:var(--font)}
  .stage{display:flex; flex-direction:column; align-items:center; gap:14px}
  .tagline{color:var(--text-dim); font-size:13px; text-align:center; line-height:1.55; max-width:380px}
  .tagline b{color:var(--brand-300)}
  .phone{
    position:relative; width:390px; height:min(844px,90vh);
    background:var(--bg); border-radius:44px; overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 11px #16111f, 0 0 0 12px #2a2440;
    display:flex; flex-direction:column;
  }
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:30px;
    background:#16111f; border-radius:0 0 18px 18px; z-index:80}
  /* 헤더 */
  header{flex:0 0 auto; padding:44px 14px 10px; display:flex; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(109,40,217,.30), rgba(109,40,217,0));
    border-bottom:1px solid var(--line); z-index:20}
  .iconbtn{appearance:none; border:0; background:rgba(255,255,255,.06); color:var(--text);
    width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer}
  .h-title{flex:1; min-width:0}
  .h-title .t1{font-weight:800; font-size:15px}
  .h-title .t2{font-size:11px; color:var(--text-dim); margin-top:1px}
  /* ① 출연자 라인업 (WHO) */
  .who{flex:0 0 auto; padding:11px 0 12px; border-bottom:1px solid var(--line); background:rgba(20,14,38,.6)}
  .who .lbl{font-size:11px; color:var(--text-dim); font-weight:700; padding:0 16px 9px; letter-spacing:.3px}
  .who .lbl b{color:var(--brand-300)}
  .strip{display:flex; gap:14px; overflow-x:auto; padding:0 16px 4px; scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .persona{flex:0 0 auto; width:62px; text-align:center; cursor:pointer}
  .persona .ring{width:58px; height:58px; margin:0 auto 5px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; background:var(--surface-2); border:2px solid transparent; transition:.16s}
  .persona:active .ring{transform:scale(.94)}
  .persona .pn{font-size:11.5px; color:var(--text-dim); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .persona.sel .ring{border-color:var(--brand-500); background:rgba(139,92,246,.18);
    box-shadow:0 0 0 3px rgba(139,92,246,.22), 0 6px 16px rgba(139,92,246,.35)}
  .persona.sel .pn{color:var(--text); font-weight:800}
  .persona.hint .ring{animation:pp 1.6s ease-in-out infinite}
  @keyframes pp{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
  /* ② 시그니처 영역 (WHICH) */
  .body{flex:1 1 auto; overflow-y:auto; padding:14px 14px 18px}
  .body::-webkit-scrollbar{width:0}
  .empty{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--text-dim); gap:10px; padding-bottom:40px}
  .empty .big{font-size:40px} .empty .e1{font-size:15px; font-weight:700; color:var(--text)} .empty .e2{font-size:12.5px}
  .sectitle{font-size:14px; font-weight:800; margin:2px 2px 12px; display:flex; align-items:center; gap:7px}
  .sectitle .em{font-size:18px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .sig{position:relative; cursor:pointer; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:14px 12px 12px; text-align:center; overflow:hidden; transition:transform .12s, border-color .16s}
  .sig:active{transform:scale(.97)}
  .sig .sem{font-size:34px; line-height:1; margin-bottom:8px; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .sig .snm{font-size:14px; font-weight:800; margin-bottom:3px}
  .sig .sfx{font-size:11px; color:var(--text-dim); line-height:1.35; min-height:30px}
  .sig .samt{margin-top:9px; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums}
  /* 티어 */
  .sig.special{border-color:rgba(139,92,246,.6); box-shadow:0 0 16px rgba(139,92,246,.12) inset}
  .sig.special .samt{color:var(--brand-300)}
  .sig.legend{border-color:rgba(251,191,36,.65)}
  .sig.legend .samt{color:var(--legend)}
  .sig.legend::before{content:""; position:absolute; inset:-1px; border-radius:16px; padding:1px; pointer-events:none;
    background:linear-gradient(120deg, transparent 20%, rgba(251,191,36,.85), transparent 80%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; background-size:200% 100%; animation:shim 2.6s linear infinite}
  @keyframes shim{0%{background-position:200% 0} 100%{background-position:-200% 0}}
  .tier-tag{position:absolute; top:8px; left:8px; font-size:8.5px; font-weight:800; letter-spacing:.6px;
    padding:3px 6px; border-radius:6px}
  .tier-tag.special{background:rgba(139,92,246,.22); color:var(--brand-300)}
  .ribbon{position:absolute; top:8px; left:-26px; transform:rotate(-45deg); width:96px; text-align:center;
    font-size:8.5px; font-weight:900; letter-spacing:.5px; color:#1a1206; padding:3px 0;
    background:linear-gradient(135deg,#FCD34D,var(--legend)); box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .badge{position:absolute; top:8px; right:8px; font-size:9px; font-weight:800; padding:3px 7px; border-radius:999px; color:#fff}
  .badge.hot{background:linear-gradient(135deg,var(--hot),var(--brand-500))}
  .badge.ai{background:linear-gradient(135deg,var(--ai),#10b981); color:#06281c}
  .customcard{grid-column:1 / -1; cursor:pointer; border:1.5px dashed var(--line); background:transparent;
    border-radius:14px; padding:13px; text-align:center; color:var(--text-dim); font-size:13px; font-weight:700}
  .customcard:active{transform:scale(.99)}
  /* 확인 시트 */
  .dim{position:absolute; inset:0; background:rgba(5,3,12,.62); z-index:40; opacity:0; transition:opacity .25s}
  .dim.on{opacity:1}
  .sheet{position:absolute; left:0; right:0; bottom:0; z-index:50; background:#1d1538;
    border-radius:24px 24px 0 0; border-top:1px solid var(--line); padding:10px 16px 18px;
    transform:translateY(106%); transition:transform .3s cubic-bezier(.2,.8,.2,1); box-shadow:0 -18px 50px rgba(0,0,0,.5)}
  .sheet.on{transform:none}
  .grab{width:42px; height:4px; border-radius:999px; background:var(--surface-2); margin:2px auto 14px}
  .cs-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .cs-sem{width:54px; height:54px; border-radius:14px; background:var(--surface-2); display:grid; place-items:center; font-size:30px}
  .cs-info{flex:1; min-width:0}
  .cs-to{font-size:11.5px; color:var(--text-dim)} .cs-to b{color:var(--brand-300)}
  .cs-nm{font-size:16px; font-weight:800; margin:1px 0}
  .cs-fx{font-size:11.5px; color:var(--text-dim)}
  .cs-amt{font-size:18px; font-weight:900; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  .cs-custom{display:none; gap:8px; margin-bottom:12px}
  .cs-custom.on{display:flex}
  .cs-custom input{flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:11px 14px; font-size:14px; font-family:var(--font); outline:none; font-variant-numeric:tabular-nums}
  .cs-custom input:focus{border-color:var(--brand-300)}
  .cs-label{font-size:11px; color:var(--text-dim); margin-bottom:8px}
  .cs-msgs{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:15px}
  .mchip{appearance:none; cursor:pointer; border:1px solid var(--line); background:var(--surface-2); color:var(--text);
    font-size:12px; font-weight:600; padding:8px 12px; border-radius:999px}
  .mchip.sel{border-color:var(--brand-500); background:rgba(139,92,246,.22)}
  .cs-send{width:100%; appearance:none; border:0; cursor:pointer; color:#fff; font-weight:800; font-size:15px;
    padding:15px; border-radius:14px; background:linear-gradient(135deg,var(--brand-500),var(--accent));
    box-shadow:0 10px 24px rgba(139,92,246,.45); font-variant-numeric:tabular-nums}
  .cs-send:active{transform:scale(.985)}
  .cs-guard{margin-top:11px; font-size:11px; color:var(--text-dim); text-align:center; font-variant-numeric:tabular-nums}
  .cs-guard u{cursor:pointer; color:var(--brand-300)}
  /* 완료 연출 */
  .success{position:absolute; inset:0; z-index:70; display:grid; place-items:center; background:rgba(5,3,12,.74);
    opacity:0; pointer-events:none; transition:opacity .3s; text-align:center}
  .success.on{opacity:1; pointer-events:auto}
  .sc-card{width:80%; animation:rise .4s ease-out}
  @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .sc-em{font-size:74px; animation:popb .55s cubic-bezier(.18,1.4,.4,1)}
  @keyframes popb{from{transform:scale(.3); opacity:0} to{transform:scale(1); opacity:1}}
  .sc-card h3{margin:8px 0 4px; font-size:19px}
  .sc-card .sc-sub{font-size:13px; color:var(--text-dim); line-height:1.55; margin-bottom:4px}
  .sc-card .sc-fx{font-size:11.5px; color:var(--brand-300); margin-bottom:20px}
  .sc-btns{display:flex; gap:9px}
  .sc-btns button{flex:1; appearance:none; cursor:pointer; border:1px solid var(--line); background:var(--surface);
    color:var(--text); font-weight:800; font-size:13px; padding:13px 6px; border-radius:13px}
  .sc-btns button.primary{border:0; color:#fff; background:linear-gradient(135deg,var(--brand-500),var(--accent))}
  #fx{position:absolute; inset:0; pointer-events:none; z-index:75}
  @media (max-width:460px){
    body{padding:0} .tagline{display:none}
    .phone{width:100vw; height:100vh; border-radius:0; box-shadow:none}
    .notch{display:none} header{padding-top:max(16px,env(safe-area-inset-top))}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="tagline">TOONAI · <b>시그니처 후원</b> — 순위·현황은 방송에서 보니까 빼고,<br>
      <b>① 누구에게</b> · <b>② 어떤 시그니처로</b> 단 두 번의 선택으로 끝냅니다.</div>
    <div class="phone">
      <div class="notch"></div>
      <header>
        <button class="iconbtn" id="back" title="새로고침">‹</button>
        <div class="h-title">
          <div class="t1">하나비 크루 · 시그니처 후원</div>
          <div class="t2">엑셀 합방 출연자에게 시그니처를 후원하세요</div>
        </div>
      </header>

      <!-- ① WHO -->
      <div class="who">
        <div class="lbl">오늘 엑셀 출연 · <b id="crewCount">5명</b> — 후원할 출연자를 골라주세요</div>
        <div class="strip" id="strip"></div>
      </div>

      <!-- ② WHICH -->
      <div class="body" id="body"></div>

      <!-- 확인 시트 -->
      <div class="dim" id="dim" style="display:none"></div>
      <div class="sheet" id="sheet">
        <div class="grab"></div>
        <div class="cs-head">
          <div class="cs-sem" id="csEm">💗</div>
          <div class="cs-info">
            <div class="cs-to">받는 분 <b id="csTo">하나비</b></div>
            <div class="cs-nm" id="csNm">심쿵 하트</div>
            <div class="cs-fx" id="csFx">하트가 팡팡 터져요</div>
          </div>
          <div class="cs-amt" id="csAmt">₩2,000</div>
        </div>
        <div class="cs-custom" id="csCustom">
          <input id="csInput" inputmode="numeric" placeholder="후원 금액 입력 (원)" autocomplete="off" />
        </div>
        <div class="cs-label">응원 한마디 — 선택 (투니 추천)</div>
        <div class="cs-msgs" id="csMsgs"></div>
        <button class="cs-send" id="csSend">시그니처 보내기</button>
        <div class="cs-guard" id="csGuard"></div>
      </div>

      <!-- 완료 연출 -->
      <div class="success" id="success">
        <div class="sc-card">
          <div class="sc-em" id="scEm">💗</div>
          <h3 id="scTitle">전달 완료!</h3>
          <div class="sc-sub" id="scSub"></div>
          <div class="sc-fx" id="scFx"></div>
          <div class="sc-btns">
            <button class="primary" id="scAgain">💜 같은 분께 한 번 더</button>
            <button id="scOther">🔄 다른 출연자</button>
          </div>
        </div>
      </div>

      <canvas id="fx"></canvas>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const fmt = n => '₩' + Math.round(n).toLocaleString('ko-KR');

  // ---------------- 데이터 ----------------
  // 출연자별 '시그니처' = 대표 후원 상품(금액·연출 내장). tier: basic/special/legend
  const CREW = [
    {id:'yuria', name:'유리아', emoji:'🦊', fan:'여우단', sigs:[
      {em:'🌧️', nm:'여우비',     amt:2000,  tier:'basic',   fx:'여우비가 촉촉이 내려요'},
      {em:'✨', nm:'홀린다',      amt:5000,  tier:'basic',   fx:'눈빛에 홀리는 연출', badge:'ai'},
      {em:'🔥', nm:'나인테일',    amt:10000, tier:'special', fx:'꼬리 9개가 화르륵'},
      {em:'👑', nm:'천년여우',    amt:50000, tier:'legend',  fx:'천년여우 변신 풀스크린'},
    ]},
    {id:'hanabi', name:'하나비', emoji:'🐰', fan:'토끼단', sigs:[
      {em:'💗', nm:'심쿵 하트',   amt:2000,  tier:'basic',   fx:'하트가 팡팡 터져요'},
      {em:'🥕', nm:'당근 점프',   amt:5000,  tier:'basic',   fx:'당근 먹고 콩콩 점프'},
      {em:'🐰', nm:'토끼굴 파티', amt:10000, tier:'special', fx:'토끼 우르르 + 시그 음성', badge:'hot'},
      {em:'🌙', nm:'달토끼 레전드',amt:50000, tier:'legend',  fx:'달토끼 떡방아 풀스크린'},
    ]},
    {id:'mint', name:'민트', emoji:'🐱', fan:'야옹단', sigs:[
      {em:'😻', nm:'골골송',      amt:2000,  tier:'basic',   fx:'골골골 진동 음성'},
      {em:'🐟', nm:'츄르 타임',   amt:5000,  tier:'basic',   fx:'츄르 쪽쪽 먹방'},
      {em:'💨', nm:'우다다 질주',  amt:10000, tier:'special', fx:'우다다 질주 연출', badge:'hot'},
      {em:'⚡', nm:'고양이신 레전드',amt:50000, tier:'legend', fx:'냥신 강림 풀스크린'},
    ]},
    {id:'doyun', name:'도윤', emoji:'🐺', fan:'늑대단', sigs:[
      {em:'🌕', nm:'하울링',      amt:2000,  tier:'basic',   fx:'아우~ 하울링 음성'},
      {em:'🐺', nm:'늑대의 포효',  amt:5000,  tier:'basic',   fx:'카리스마 포효'},
      {em:'🌙', nm:'달빛 질주',   amt:10000, tier:'special', fx:'달빛 아래 질주'},
      {em:'👑', nm:'알파 레전드',  amt:50000, tier:'legend',  fx:'알파 늑대 군림 풀스크린', badge:'hot'},
    ]},
    {id:'dawn', name:'새벽', emoji:'🦉', fan:'올빼미단', sigs:[
      {em:'🦉', nm:'부엉 인사',   amt:2000,  tier:'basic',   fx:'부엉~ 인사 연출'},
      {em:'⭐', nm:'별빛 응원',   amt:5000,  tier:'basic',   fx:'별빛이 쏟아져요', badge:'hot'},
      {em:'🌌', nm:'새벽 감성',   amt:10000, tier:'special', fx:'잔잔한 새벽 감성 연출'},
      {em:'🌠', nm:'불면의 현자', amt:50000, tier:'legend',  fx:'별똥별 풀스크린 + 시그 음성'},
    ]},
  ];
  const MSGS = ['오늘도 화이팅 💜','우리 크루 최고 🔥','조용히 보태고 가요 🤫','시그니처 받아랏 😎'];
  const DAY_LIMIT = 300000;
  const TIER_TXT = {special:'SPECIAL', legend:'LEGEND'};
  const byId = id => CREW.find(c => c.id === id);

  // ---------------- 상태 ----------------
  let selPerson = null, sentToday = 0;
  let cur = null;     // 확인 시트 대상: {personId, sig, custom}
  let selAmount = 0, selMsg = null;

  // ---------------- ① WHO 라인업 ----------------
  function renderStrip(){
    $('#crewCount').textContent = CREW.length + '명';
    const strip = $('#strip'); strip.innerHTML = '';
    CREW.forEach(c => {
      const el = document.createElement('div');
      el.className = 'persona' + (c.id === selPerson ? ' sel' : (selPerson ? '' : ' hint'));
      el.innerHTML = `<div class="ring">${c.emoji}</div><div class="pn">${c.name}</div>`;
      el.onclick = () => selectPerson(c.id);
      strip.appendChild(el);
    });
  }
  function selectPerson(id){
    selPerson = id;
    renderStrip();
    renderSignatures();
  }

  // ---------------- ② WHICH 시그니처 ----------------
  function renderSignatures(){
    const body = $('#body');
    if(!selPerson){
      body.innerHTML = `<div class="empty">
        <div class="big">👆</div>
        <div class="e1">후원할 출연자를 골라주세요</div>
        <div class="e2">위 라인업에서 한 명을 선택하면<br>그 사람의 시그니처가 나타나요</div>
      </div>`;
      return;
    }
    const c = byId(selPerson);
    let html = `<div class="sectitle"><span class="em">${c.emoji}</span> ${c.name}의 시그니처</div><div class="grid">`;
    c.sigs.forEach((s,i) => {
      const tierTag = s.tier === 'legend'
        ? `<div class="ribbon">LEGEND</div>`
        : (s.tier === 'special' ? `<div class="tier-tag special">SPECIAL</div>` : '');
      const badge = s.badge === 'hot' ? `<div class="badge hot">🔥 인기</div>`
                  : s.badge === 'ai' ? `<div class="badge ai">🤖 추천</div>` : '';
      html += `<div class="sig ${s.tier}" data-i="${i}">
        ${tierTag}${badge}
        <span class="sem">${s.em}</span>
        <div class="snm">${s.nm}</div>
        <div class="sfx">${s.fx}</div>
        <div class="samt">${fmt(s.amt)}</div>
      </div>`;
    });
    html += `<div class="customcard" id="customCard">✏️ 직접 금액으로 후원하기</div></div>`;
    body.innerHTML = html;
    body.scrollTop = 0;
    body.querySelectorAll('.sig').forEach(el =>
      el.onclick = () => openConfirm(selPerson, c.sigs[+el.dataset.i], false));
    $('#customCard').onclick = () => openConfirm(selPerson,
      {em:'✏️', nm:'직접 금액 후원', amt:5000, tier:'basic', fx:'원하는 금액으로 응원'}, true);
  }

  // ---------------- 확인 시트 ----------------
  function openConfirm(personId, sig, custom){
    cur = {personId, sig, custom};
    selMsg = null;
    selAmount = custom ? 0 : sig.amt;
    const c = byId(personId);
    $('#csEm').textContent = sig.em;
    $('#csTo').textContent = c.name;
    $('#csNm').textContent = sig.nm;
    $('#csFx').textContent = sig.fx;
    $('#csCustom').classList.toggle('on', !!custom);
    if(custom){ $('#csInput').value = ''; $('#csAmt').textContent = '₩—'; }
    else $('#csAmt').textContent = fmt(sig.amt);
    // 응원 한마디
    const mw = $('#csMsgs'); mw.innerHTML = '';
    MSGS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'mchip'; b.textContent = t;
      b.onclick = () => {
        selMsg = (selMsg === t) ? null : t;
        mw.querySelectorAll('.mchip').forEach(x => x.classList.toggle('sel', x.textContent === selMsg));
      };
      mw.appendChild(b);
    });
    updateSendLabel(); refreshGuard();
    $('#dim').style.display = ''; requestAnimationFrame(() => $('#dim').classList.add('on'));
    $('#sheet').classList.add('on');
    if(custom) setTimeout(() => $('#csInput').focus(), 320);
  }
  function updateSendLabel(){
    $('#csSend').textContent = selAmount >= 1000 ? `${fmt(selAmount)} 시그니처 보내기` : '시그니처 보내기';
  }
  function refreshGuard(){
    const near = sentToday >= DAY_LIMIT * 0.8;
    $('#csGuard').innerHTML = (near ? '오늘 많이 응원했어요 ☕ ' : '') +
      `오늘 후원 ${fmt(sentToday)} · <u id="limitLink">한도 설정</u>`;
    $('#csGuard').querySelector('#limitLink').onclick = e => {
      e.stopPropagation(); toastLite('한도 설정 화면은 본 구현에서 제공돼요 (데모) 🛡️');
    };
  }
  $('#csInput').addEventListener('input', e => {
    selAmount = parseInt(e.target.value.replace(/[^0-9]/g,''), 10) || 0;
    $('#csAmt').textContent = selAmount ? fmt(selAmount) : '₩—';
    updateSendLabel();
  });
  function closeConfirm(){
    $('#sheet').classList.remove('on');
    const d = $('#dim'); d.classList.remove('on');
    setTimeout(() => d.style.display = 'none', 260);
  }
  $('#dim').onclick = closeConfirm;
  $('#csSend').onclick = () => {
    if(cur.custom && selAmount < 1000){ toastLite('1,000원부터 후원할 수 있어요!'); return; }
    const amt = selAmount, sig = cur.sig, c = byId(cur.personId);
    sentToday += amt;
    closeConfirm();
    setTimeout(() => showSuccess(c, sig, amt), 220);
  };

  // ---------------- 완료 연출 ----------------
  function showSuccess(c, sig, amt){
    $('#scEm').textContent = sig.em;
    $('#scTitle').textContent = `${c.name}님께 전달! 🎉`;
    $('#scSub').innerHTML = `<b style="color:var(--text)">${sig.nm}</b> · ${fmt(amt)}` +
      (selMsg ? `<br>"${selMsg}"` : '');
    $('#scFx').textContent = `방송 화면에 「${sig.fx}」 연출이 재생됐어요`;
    $('#success').classList.add('on');
    burst(sig.em);
  }
  $('#scAgain').onclick = () => { $('#success').classList.remove('on'); /* 같은 사람 유지 */ };
  $('#scOther').onclick = () => {
    $('#success').classList.remove('on');
    $('#strip').scrollIntoView({behavior:'smooth'});
    toastLite('위 라인업에서 다른 출연자를 골라보세요 👆');
  };
  $('#back').onclick = () => location.reload();

  // ---------------- 라이트 토스트 ----------------
  let toastT = null;
  function toastLite(msg){
    let t = $('#toastLite');
    if(!t){
      t = document.createElement('div'); t.id = 'toastLite';
      t.style.cssText = 'position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;'+
        'background:#241b44;border:1px solid var(--line);color:var(--text);font-size:12.5px;'+
        'padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:84%;text-align:center';
      $('.phone').appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = '0', 2600);
  }

  // ---------------- 버스트 연출 (시그니처 이모지) ----------------
  function burst(emoji){
    const cv = $('#fx'), ctx = cv.getContext('2d');
    const r = cv.getBoundingClientRect(); cv.width = r.width; cv.height = r.height;
    const colors = ['#8B5CF6','#F472B6','#FBBF24','#34D399','#C4B5FD','#fff'];
    const P = [];
    for(let i=0;i<26;i++) P.push({type:'emoji', x:r.width/2, y:r.height*0.34,
      vx:(Math.random()-.5)*7, vy:Math.random()*-9-2, g:.22+Math.random()*.1,
      rot:Math.random()*6, vr:(Math.random()-.5)*.3, s:20+Math.random()*16});
    for(let i=0;i<90;i++) P.push({type:'conf', x:r.width/2, y:r.height*0.34,
      vx:(Math.random()-.5)*9, vy:Math.random()*-11-3, g:.26+Math.random()*.12,
      rot:Math.random()*6, vr:(Math.random()-.5)*.35, s:4+Math.random()*6,
      col:colors[i%colors.length]});
    let t = 0;
    (function frame(){
      ctx.clearRect(0,0,cv.width,cv.height); t++;
      P.forEach(p => {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        if(p.type === 'emoji'){ ctx.font = p.s+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(emoji,0,0); }
        else { ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); }
        ctx.restore();
      });
      if(t < 150) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
    })();
  }

  // ---------------- 부팅 ----------------
  renderStrip();
  renderSignatures();
})();
</script>
</body>
</html>
